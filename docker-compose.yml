version: '3.8'

services:
  shift-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shift-app
    ports:
      # Admin interface on 8080
      - "8080:8080"
      # Input interface on 8081
      - "8081:8081"
    volumes:
      # Persist submission data across container restarts
      - ./data/submissions:/app/data/submissions
      - ./data/month-config.json:/app/data/month-config.json
    environment:
      ADMIN_PORT: 8080
      INPUT_PORT: 8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client; http.client.HTTPConnection('localhost', 8080).request('GET', '/api/info'); exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
