# サブドメイン分割の例
# admin.example.com → 管理画面（8080）
# shift.example.com → 入力画面（8081）
#
# アプリ側は次を設定する:
#   ADMIN_PUBLIC_URL=https://admin.example.com/
#   INPUT_PUBLIC_URL=https://shift.example.com/
#
# 管理画面は Basic 認証・VPN・IP制限のいずれかで保護すること。

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    # ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    # auth_basic "Shift Admin";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name shift.example.com;

    # ssl_certificate     /etc/letsencrypt/live/shift.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shift.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.example.com shift.example.com;
    return 301 https://$host$request_uri;
}
